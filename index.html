function blip(f,d,typ){
  if(!sound) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=typ||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}

function ease(t,seg){
  if(seg==='cliff'){
    /* the ground holds — and then it simply is not there any more */
    if(t<.80) return (t/.80)*.04;                               /* es trägt noch */
    if(t<.845) return .04+Math.pow((t-.80)/.045,1.1)*.94;       /* und dann nicht mehr */
    return .98+((t-.845)/.155)*.02;                             /* unten */
  }
  if(seg==='climb'){
    /* steepest right at the bottom, where you have the least left */
    return Math.pow(t,.55);
  }
  return (1-Math.cos(t*Math.PI))/2;
}
function groundY(wx){
  if(wx<=ST[0].x) return ST[0].gy;
  if(wx>=ST[N-1].x) return ST[N-1].gy;
  for(var i=0;i<N-1;i++){
    if(wx>=ST[i].x && wx<=ST[i+1].x){
      var t=(wx-ST[i].x)/(ST[i+1].x-ST[i].x);
      return ST[i].gy+(ST[i+1].gy-ST[i].gy)*ease(t,ST[i].seg);
    }
  }
  return 120;
}
function blend(){
  var wx=player.x, a=ST[0], b=ST[0], t=0, i;
  if(wx>=ST[N-1].x){ a=b=ST[N-1]; }
  else if(wx>ST[0].x) for(i=0;i<N-1;i++){
    if(wx>=ST[i].x && wx<=ST[i+1].x){
      a=ST[i]; b=ST[i+1];
      t=(wx-ST[i].x)/(ST[i+1].x-ST[i].x); t=(1-Math.cos(t*Math.PI))/2; break;
    }
  }
  function m(k,j){ return Math.round(a.p[k][j]+(b.p[k][j]-a.p[k][j])*t); }
  return { sky:[m('sky',0),m('sky',1),m('sky',2)], deep:[m('deep',0),m('deep',1),m('deep',2)],
           gnd:[m('gnd',0),m('gnd',1),m('gnd',2)], cap:[m('cap',0),m('cap',1),m('cap',2)],
           star:a.p.star+(b.p.star-a.p.star)*t, jag:a.p.jag+(b.p.jag-a.p.jag)*t,
           day:a.p.day+(b.p.day-a.p.day)*t, light:(t<.5?a.p.light:b.p.light),

}

function px(a,b,w,h,c){ x.fillStyle=c; x.fillRect(a|0,b|0,w,h); }

function person(sx,sy,fr,o,bob,hurt,air){
  var h=o.h||1, skin=o.skin||'#E8D3AE', cloth=o.cloth||'#33406A';
  var headS=Math.max(3,Math.round(4*h)), bodyH=Math.max(4,Math.round(6*h)), legH=Math.max(2,Math.round(4*h));
  var top=sy-(headS+bodyH+legH)+(bob||0)+(hurt?1:0);
  if(o.pack) px(sx-1,top+headS,2,bodyH-1,'#6A5230');
  px(sx+1,top,headS,headS,skin);
  if(o.cap){ px(sx,top-1,headS+2,1,o.cap); px(sx+1,top-2,headS,1,o.cap); }
  px(sx+1,top+headS,headS,bodyH,cloth);
  if(air){
    /* nothing under the feet: legs tuck, arms go up */
    px(sx+1,top+headS+bodyH,1,legH-1,'#20263A');
    px(sx+headS,top+headS+bodyH,1,legH-1,'#20263A');
    px(sx,top+headS-1,1,2,skin); px(sx+headS+1,top+headS-1,1,2,skin);
    return;
  }
  px(sx+1,top+headS+bodyH,1,legH,'#20263A');
  /* wounded: the trailing leg drags */
  px(sx+headS,top+headS+bodyH,1,hurt?legH:(legH-((fr%2)?1:0)),'#20263A');
  if(hurt) px(sx+headS+1,top+headS+bodyH+legH-1,1,1,'#20263A');
  px(sx+((fr%2)?0:headS+1),top+headS+1,1,Math.max(1,Math.round(3*h)),skin);

    for(r=3;r>0;r--){ x.globalAlpha=.026*glow*r; px(sx-2-r,ty-r,W2+4+r*2,H2+2+r*2,'#CFE0F2'); }
    x.globalAlpha=1;
    px(sx-2,ty,W2+4,H2+2,lit?'#8FA9C6':'#3E4B66');           /* frame */
    px(sx,ty+2,W2,H2-2,'#121A2A');                            /* glass  */
    x.globalAlpha=lit?.95:.4;
    var pastAv=AVATAR[st.mirror]||AVATAR[0];
    person(sx+3,ty+H2-3,(tt/34|0),{h:(pastAv.h||1)*.62,cloth:pastAv.cloth,skin:pastAv.skin,cap:pastAv.cap});
    x.globalAlpha=1;
    x.globalAlpha=.20+Math.sin(tt*.05+i)*.08;                 /* glass sheen */
    px(sx+1,ty+3,2,H2-4,'#DCEBFA'); x.globalAlpha=1;
    if(lit) px(sx+5,ty-7-Math.sin(tt*.06+i)*2,3,3,'#E9C06A');
    return;
  }

  var col=(st.gy<120)?'#EDE4D0':'#D08A3C';
  for(r=3;r>0;r--){ x.globalAlpha=.030*glow*r; px(sx-r,gy-16-r,5+r*2,16+r*2,col); }
  x.globalAlpha=1;
  px(sx,gy-16,5,16,lit?col:'#4A5472');
  px(sx+1,gy-14,3,2,lit?'#0A0E18':col);
  if(lit){ px(sx+1,gy-22-Math.sin(tt*.06+i)*2,3,3,'#E9C06A'); }
}

/* ══════════════ Kulissen in drei Tiefen ══════════════
   fern (langsam, hell, dunstig) · mitte (die Bauten) · nah (dunkel, schnell) */
function anchor(par,sx){
  /* Boden unter DIESER Bildposition, geglaettet — sonst springen die Bauten */
  var w=camX*par+sx;
  return ((groundY(w-70)+groundY(w-24)+groundY(w)+groundY(w+24)+groundY(w+70))/5)|0;
}
function wrapX(i,spacing,par,pad){
  return ((i*spacing - camX*par)%(VW+pad)+VW+pad)%(VW+pad)-pad/2;
}
var SCENE={
  table:  {far:'istanbul',  mid:'mTable',   near:'olive'},
  gate:   {far:'hillsCold', mid:'mGate',    near:'rail'},
  ocean:  {far:'sea',       mid:'mCoast',   near:'palm'},
  sold:   {far:'flatGrey',  mid:'mSold',    near:'fence'},
  masts:  {far:'alps',      mid:'mBarracks',near:'pine'},
  derrick:{far:'scrub',     mid:'mDerrick', near:'acacia'},
  arch:   {far:'hillsWarm', mid:'mArch',    near:'cypress'},
  home:   {far:'hillsWarm', mid:'mHome',    near:'bare'},
  ruin:   {far:'broken',    mid:'mRuin',    near:'rubble'},
  city:   {far:'skyline',   mid:'mCity',    near:'lamp'},
  grid:   {far:'flatCool',  mid:'mGrid',    near:'none'},
  none:   {far:'hillsCold', mid:'none',     near:'none'}
};

/* ── Bausteine ── */
function ridge(par,amp,base,freq,col,jag,snow){
  for(var i=0;i<VW;i++){
    var w=(camX*par+i)*freq;
    var h=base+Math.sin(w)*amp+Math.sin(w*2.3)*amp*.45+(jag?Math.sin(w*7.1)*amp*.32:0);
    px(i,h,1,VH-h,col);
    if(snow&&h<base-amp*.45) px(i,h,1,1+((i*5)%3),'rgba(230,240,252,.62)');
  }
}
function tri(w){ var q=(w/Math.PI)%2; if(q<0)q+=2; return q<1?q:2-q; }
function peaks(par,base,col,snow){
  for(var i=0;i<VW;i++){
    var w=(camX*par+i)*.013;
    var h=base-Math.pow(tri(w),.75)*38-Math.pow(tri(w*2.3+1.1),.8)*17-tri(w*5.9)*7;
    px(i,h,1,VH-h,col);
    if(snow&&h<base-34) px(i,h,1,3+((i*7)%4),'rgba(248,252,255,.95)');
  }
}
function atmo(P,f,d){
  /* f = Grundhelligkeit der Silhouette, d = Distanz 0..1 */
  var m=Math.min(.82,d*.62*P.day+.06);
  return 'rgb('+Math.round(P.cap[0]*f+(P.sky[0]-P.cap[0]*f)*m)+','+
                Math.round(P.cap[1]*f+(P.sky[1]-P.cap[1]*f)*m)+','+
                Math.round(P.cap[2]*f+(P.sky[2]-P.cap[2]*f)*m)+')';
}
function haze(y,h,col,a){ x.globalAlpha=a; px(0,y,VW,h,col); x.globalAlpha=1; }
/* Hagia Sophia — flache weite Kuppel, gestufte Kaskade, vier Minarette
   die nur knapp ueber den Kuppelscheitel ragen (das ist die Signatur) */
function hagia(cx,by,col,warm){
  var bw=62, bh=16, apex=by-34, i;
  /* Minarette zuerst, sie stehen hinter dem Block */
  var mx=[cx-bw/2+3, cx-bw/2+13, cx+bw/2-15, cx+bw/2-5];
  for(i=0;i<4;i++){
    var w2=(i===2)?3:2, top=apex-5;
    px(mx[i],top,w2,by-top,(i===2)?warm:col);
    px(mx[i]-1,top+9,w2+2,1,col);           /* Serefe */
    px(mx[i],top-2,w2,2,col);               /* Kappe  */
  }
  /* dritte, flachste Stufe */
  px(cx-bw/2,apex+12,bw,by-(apex+12),col);
  /* Halbkuppeln */
  for(i=0;i<17;i++){
    var hh=Math.round(Math.sqrt(Math.max(0,1-Math.pow((i-8)/8.5,2)))*7);
    px(cx-25+i,apex+10-hh,1,hh+3,col);
    px(cx+9+i,apex+10-hh,1,hh+3,col);
  }
  /* Hauptkuppel: Breite zu Hoehe 5:2, flach */
  for(i=0;i<24;i++){
    var dh=Math.round(Math.sqrt(Math.max(0,1-Math.pow((i-11.5)/12,2)))*10);
    px(cx-12+i,apex+10-dh,1,dh+4,col);
  }
  px(cx-12,apex+11,24,2,warm);                /* Fensterband am Kuppelfuss */
  /* Strebepfeiler */
  for(i=0;i<5;i++){ px(cx-bw/2+3+i*14,apex+16,2,by-(apex+16),warm); }
}

/* Surfers Paradise — lueckenlose Turmwand, in der Mitte ein Massiv,
   daraus der Q1 mit gerundeter Schulter und haarfeiner Nadel */
function surfers(baseY,col,lit,par){
  var i, off=(camX*par)|0;
  for(i=0;i<VW;i++){
    var wx=(i+off), n=((wx/7)|0);
    var h=13+((n*37)%11)+((n*13)%7);
    var d=Math.abs(((wx%1600)+1600)%1600-820);
    if(d<150) h+=18-Math.round(d/12);        /* Massiv im mittleren Drittel */
    px(i,baseY-h,1,h,col);
    if(((wx*3)|0)%7===0 && h>16) px(i,baseY-h+2,1,1,lit);
  }
  /* Q1 — steht im Massiv, ragt weit darueber hinaus */
  var period=1600, qw=((820-off)%period+period)%period;
  var cand=[qw-period, qw, qw+period];
  for(var qi=0;qi<cand.length;qi++){
    var qx=cand[qi];
    if(qx<-30||qx>VW+30) continue;
    var qh=72;
    px(qx,baseY-qh,8,qh,col);
    px(qx+1,baseY-qh-4,6,4,col);
    px(qx+2,baseY-qh-8,4,4,col);
    px(qx+3,baseY-qh-26,2,18,col);
    for(i=5;i<qh;i+=6) px(qx+1,baseY-qh+i,6,1,lit);
  }
}

/* Panzer 87 — sehr langer flacher Kasten auf Kettenband, Glacis vorn,
   Turm auf der hinteren Haelfte, langes Rohr nach vorn */
function panzer(bx,by,col,dark){
  px(bx,by-3,26,3,dark);                     /* Kettenband */
  for(var i=0;i<6;i++) px(bx+2+i*4,by-2,2,2,col);
  px(bx+2,by-7,22,4,col);                    /* Wanne */
  px(bx,by-6,3,3,col);                       /* Glacis vorn */
  px(bx+1,by-7,2,1,col);
  px(bx+9,by-11,11,4,col);                   /* Turm */
  px(bx+11,by-12,6,1,col);
  px(bx-9,by-10,14,1,col);                   /* Kanonenrohr */
  px(bx+19,by-12,1,2,col);                   /* Luke */
}

/* Schweizer Schulhaus — langer ruhiger Quader, flaches Dach,
   breiter niedriger Uhrenaufsatz, Turnhallentrakt, Fahnenmast */
function schulhaus(bx,by,col,lit,accent){
  var W=104, H=30, i, r, c;
  px(bx,by-H,W,H,col);
  px(bx-2,by-H-3,W+4,3,lit);                 /* flaches Dach */
  for(r=0;r<3;r++) for(c=0;c<26;c++)
    px(bx+5+c*3.6,by-H+6+r*7,1,3,lit);       /* Fensterraster */
  px(bx+W/2-9,by-H-3,18,4,col);              /* Eingangsrisalit */
  px(bx+W/2-6,by-H-9,12,6,col);              /* Uhrenaufsatz, breit und flach */
  px(bx+W/2-2,by-H-7,4,3,lit);
  px(bx+W,by-16,34,16,col);                  /* Turnhalle */
  px(bx+W-2,by-19,38,3,lit);
  px(bx+W+4,by-11,26,3,lit);                 /* Bandfenster */
  px(bx-16,by-24,1,24,lit);                  /* Fahnenmast */
  px(bx-15,by-24,4,3,accent);
}

/* Baobab: dicker Fassstamm, flache sparrige Krone */
function baobab(bx,by,sc,col){
  var tw=Math.round(7*sc), th=Math.round(17*sc), i;
  px(bx,by-th,tw,th,col);
  px(bx-1,by-4*sc,tw+2,4*sc,col);
  for(i=0;i<5;i++){
    var a=[-9,-5,0,5,9][i]*sc, l=[4,6,7,6,4][i]*sc;
    px(bx+tw/2+a-1,by-th-l,2,l,col);
  }
  px(bx-8*sc,by-th-2,tw+16*sc,2,col);
}
function akazie(bx,by,sc,col){
  px(bx+2,by-9*sc,2,9*sc,col);
  px(bx-8*sc,by-12*sc,20*sc,3*sc,col);
  px(bx-4*sc,by-14*sc,12*sc,2*sc,col);
}
/* Foerderturm mit Seilrad und schraegen Stuetzbeinen */
function foerderturm(bx,by,col){
  px(bx+4,by-32,3,32,col); px(bx+11,by-32,3,32,col);
  px(bx+4,by-18,10,2,col); px(bx+4,by-8,10,2,col);
  for(var i=0;i<10;i++) px(bx+4+i,by-28+i,1,1,col);
  px(bx+6,by-36,5,5,col);                    /* Seilrad */
  for(i=0;i<12;i++) px(bx+14+i,by-30+i*2.4,2,2,col);
}
function tree(kind,bx,by,sc,col){
  var i,w;
  if(kind==='pine'){
    px(bx+2,by-5*sc,2*sc,5*sc,col);
    for(i=0;i<6;i++){ w=(15-i*2.2)*sc; px(bx+3-w/2,by-(5+i*3.4)*sc,w,4*sc,col); }
    px(bx+2,by-27*sc,2,3*sc,col);
  } else if(kind==='palm'){
    var th2=Math.round(14*sc);
    for(i=0;i<th2;i++) px(bx+2+Math.round(Math.sin(i/(th2*.9))*3),by-i,2+(i<th2*.3?1:0),1,col);
    var ty2=by-th2, fr=[[-11,-2],[-7,-6],[0,-8],[7,-6],[11,-2]];
    for(i=0;i<fr.length;i++){
      var ex=fr[i][0]*sc, ey=fr[i][1]*sc, steps=Math.max(3,Math.round(Math.abs(ex)));
      for(var t3=0;t3<=steps;t3++){
        var u2=t3/steps;
        var fx2=bx+3+ex*u2, fy2=ty2+ey*u2+u2*u2*4*sc;
        px(fx2,fy2,2,2+(u2<.5?1:0),col);
      }
    }  } else if(kind==='acacia'){
    px(bx+3,by-11*sc,2,11*sc,col);
    for(i=0;i<4;i++){ w=(20-i*5)*sc; px(bx+4-w/2,by-(13+i*2)*sc,w,2*sc,col); }
  } else if(kind==='cypress'){
    for(i=0;i<18*sc;i++){
      w=Math.max(1,Math.round((1-Math.abs(i-9*sc)/(11*sc))*5*sc));
      px(bx+3-w/2,by-i,w,1,col);
    }
  } else if(kind==='bare'){
    px(bx+3,by-13*sc,1,13*sc,col);
    px(bx-1,by-13*sc,5,1,col); px(bx+1,by-16*sc,5,1,col);
    px(bx-2,by-10*sc,3,1,col); px(bx+4,by-11*sc,3,1,col);
  } else if(kind==='olive'){
    px(bx+3,by-8*sc,2,8*sc,col);
    var ow=[8,13,15,14,10,5];
    for(i=0;i<ow.length;i++){ w=ow[i]*sc; px(bx+4-w/2,by-(8+i*2)*sc,w,2*sc,col); }
  }
}

/* ── ferne Ebene ── */
function farLayer(kind,al,P){
  if(al<=.01) return;
  var sc=SCENE[kind]||SCENE.none, k=sc.far, i, bx, h, w;
  x.globalAlpha=al;
  var c1=atmo(P,.34,1), c2=atmo(P,.50,.66);

  if(k==='alps'){ peaks(.10,96,atmo(P,.30,1),true); peaks(.18,110,atmo(P,.44,.62),false); }
  else if(k==='hillsWarm'){
    ridge(.10,13,96,.018,c1,0,0); ridge(.18,10,110,.026,c2,0,0);
  }
  else if(k==='istanbul'){
    ridge(.09,10,104,.016,c1,0,0);
    var hx=((VW*.46 - camX*.13)%(VW+220)+VW+220)%(VW+220)-110;
    if(hx>-140&&hx<VW+140) hagia(hx,96,atmo(P,.20,.42),atmo(P,.34,.34));
    /* Galata Turm links, zweite Moschee rechts */
    var gx=hx-92;
    if(gx>-20&&gx<VW+20){
      px(gx,80,3,20,atmo(P,.28,.9)); px(gx-1,86,5,1,atmo(P,.28,.9));
      px(gx,76,3,4,atmo(P,.34,.9));
    }
    var m2=hx+78;
    if(m2>-20&&m2<VW+20){
      for(i=0;i<9;i++){ var d2=Math.round(Math.sqrt(Math.max(0,1-Math.pow((i-4)/4.5,2)))*4);
        px(m2+i,96-d2,1,d2+8,atmo(P,.28,.9)); }
      px(m2+10,84,2,20,atmo(P,.28,.9));
    }
    ridge(.18,5,112,.030,c2,0,0);
  }
  else if(k==='hillsCold'){ ridge(.10,11,100,.020,c1,0,0); ridge(.18,9,112,.028,c2,1,0); }
  else if(k==='sea'){
    var hz=Math.max(48,Math.min(150,anchor(.20,VW/2)-32));
    /* Wasser: am Horizont hell, nach vorn tiefer */
    for(var wy2=hz;wy2<VH;wy2++){
      var q=Math.min(1,(wy2-hz)/34);
      px(0,wy2,VW,1,'rgb('+Math.round(126-q*70+P.day*28)+','+
                           Math.round(200-q*86+P.day*22)+','+
                           Math.round(206-q*70+P.day*18)+')');
    }
    haze(hz-2,3,atmo(P,.9,1),.55);
    /* Schaumkaemme */
    for(i=0;i<VW;i+=2){
      var wv=hz+5+Math.sin((i+tt*.55)*.085)*1.8+Math.sin((i-tt*.35)*.05)*1.3;
      px(i,wv,2,1,'rgba(240,252,255,.65)');
      if((i+((tt*.3)|0))%22===0) px(i,wv+6,4,1,'rgba(255,255,255,.8)');
      if((i+((tt*.22)|0))%34===0) px(i,wv+13,6,1,'rgba(255,255,255,.55)');
    }
    /* Segel am Horizont */
    var sbx=((VW*.30 - camX*.05)%(VW+80)+VW+80)%(VW+80)-40;
    px(sbx,hz-9,1,9,'rgba(255,255,255,.85)');
    px(sbx+1,hz-8,4,7,'rgba(255,255,255,.75)');
    px(sbx-2,hz,7,1,'rgba(60,90,110,.7)');
    /* Moewen */
    for(i=0;i<5;i++){
      var gx2=wrapX(i,84,.14,110), gy2=30+((i*23)%22)+Math.sin(tt*.035+i)*3;
      px(gx2,gy2,1,1,'rgba(255,255,255,.9)'); px(gx2+1,gy2-1,1,1,'rgba(255,255,255,.9)');
      px(gx2+2,gy2,1,1,'rgba(255,255,255,.9)');
    }
    var cs=[[0,0],[3,11],[-4,6],[5,4],[1,5]], ccx=VW*.40-((camX*.05)%40);
    if(P.day<.4) for(i=0;i<cs.length;i++) px(ccx+cs[i][0]*2,22+cs[i][1]*2,1+(i<2?1:0),1,'#F4FAFF');
  }
  else if(k==='flatGrey'){ ridge(.10,4,104,.014,c1,0,0); haze(100,14,shade(P.cap,.20),.5); }
  else if(k==='flatCool'){ px(0,104,VW,VH-104,shade(P.cap,.16)); haze(100,8,shade(P.cap,.26),.4); }
  else if(k==='scrub'){
    ridge(.10,5,104,.016,shade(P.cap,.26),0,0);
    haze(98,12,shade(P.cap,.24),.45);
  }
  else if(k==='broken'){
    for(i=0;i<22;i++){
      bx=wrapX(i,44,.12,60); h=8+((i*53)%22); w=5+((i*31)%7);
      px(bx,112-h,w,h+30,atmo(P,.20,1));
    }
    haze(106,10,atmo(P,.18,1),.5);
  }
  else if(k==='skyline'){
    for(i=0;i<34;i++){
      bx=wrapX(i,52,.10,70); h=20+((i*67)%40); w=7+((i*23)%8);
      px(bx,112-h,w,h+30,atmo(P,.24,1));
      for(var wy=2;wy<h-3;wy+=4)
        if((i*3+wy)%5<2) px(bx+2,112-h+wy,1,2,'rgba(190,220,255,.42)');
    }
    haze(104,12,shade(P.cap,.20),.42);
  }
  x.globalAlpha=1;
}

/* ── mittlere Ebene: die Bauten ── */
function midLayer(kind,al,P){
  if(al<=.01) return;
  var sc=SCENE[kind]||SCENE.none, k=sc.mid; if(k==='none') return;
  x.globalAlpha=al;
  var i,bx,by,h,w,cA=atmo(P,.44,.34), cB=atmo(P,.32,.30);

  if(k==='mTable'){
    /* niedrige Dorfhaeuser auf der Bodenlinie, klein und ruhig */
    for(i=0;i<6;i++){
      bx=wrapX(i,132,.26,160); by=anchor(.26,bx)-2;
      h=9+((i*37)%4); w=17+((i*29)%7);
      px(bx,by-h,w,h,cB); px(bx-1,by-h-2,w+2,2,cA);
      px(bx+3,by-h+3,2,2,'rgba(252,214,150,.9)');
    }
    /* der grosse Tisch: ein Element, nicht ein Band ueber die ganze Breite */
    for(i=0;i<2;i++){
      bx=wrapX(i,420,.40,460); by=anchor(.40,bx)-2;
      var TW=78;
      px(bx,by-11,TW,2,shade(P.cap,.62));          /* Platte */
      px(bx,by-9,TW,3,shade(P.cap,.34));           /* Tuch   */
      for(var lg2=0;lg2<5;lg2++) px(bx+4+lg2*17,by-6,2,6,cB);
      for(var pe=0;pe<7;pe++){
        var qx2=bx+6+pe*11;
        px(qx2,by-16,3,5,cA);                       /* Sitzende, klein */
        px(qx2,by-19,3,3,shade(P.cap,.52));
      }
      for(var cd=0;cd<4;cd++){
        px(bx+9+cd*20,by-15,1,4,'rgba(255,226,158,.95)');
        px(bx+9+cd*20,by-18,1,3,'rgba(255,244,206,.85)');
      }
    }
  }
  else if(k==='mGate'){
    /* Schulhaus mit Pausenplatz, Zaun und geschlossenem Tor */
    for(i=0;i<3;i++){
      bx=wrapX(i,340,.32,380); by=anchor(.32,bx)-2;
      schulhaus(bx,by,cB,shade(P.cap,.16),'rgba(196,60,48,.9)');
    }
    for(i=0;i<20;i++){
      bx=wrapX(i,34,.44,50); by=anchor(.44,bx)-2;
      px(bx,by-11,1,11,cA);
    }
    for(i=0;i<3;i++){
      bx=wrapX(i,340,.44,380); by=anchor(.44,bx)-2;
      px(bx,by-17,3,17,cA); px(bx+30,by-17,3,17,cA);
      px(bx,by-20,33,3,cA);
      for(var b3=0;b3<7;b3++) px(bx+4+b3*4,by-15,2,15,cB);
      px(bx+14,by-9,4,4,shade(P.cap,.6));
    }
  }
  else if(k==='mCoast'){
    /* Turmwand von Surfers Paradise direkt hinter dem Strand */
    var hz2=Math.max(48,Math.min(150,anchor(.20,VW/2)-30));
    surfers(hz2+2,atmo(P,.30,.55),'rgba(255,252,236,.75)',.20);
    /* Duenensaum davor */
    for(i=0;i<VW;i++){
      var dw=(camX*.34+i)*.026;
      var dh=groundY(camX+i)-7+Math.sin(dw)*4;

/* ══════════════ world ══════════════ */
function drawWorld(){
  var P=blend(), i;
  for(var yy=0;yy<VH;yy++){
    var t=yy/118; if(t>1)t=1; t=Math.pow(t,1.5-P.day*.7);
    px(0,yy,VW,1,'rgb('+Math.round(P.deep[0]+(P.sky[0]-P.deep[0])*t)+','+
                        Math.round(P.deep[1]+(P.sky[1]-P.deep[1])*t)+','+
                        Math.round(P.deep[2]+(P.sky[2]-P.deep[2])*t)+')');
  }
  /* Sonne oder Mond, je nach Kapitel */
  if(P.light){
    var L=P.light, lxs=VW*L.x, lys=L.y;
    var lg2=x.createRadialGradient(lxs,lys,0,lxs,lys,L.r*5.5);
    lg2.addColorStop(0,'rgba(255,244,206,'+(.34+P.day*.22).toFixed(2)+')');
    lg2.addColorStop(.42,'rgba(255,226,164,.10)');
    lg2.addColorStop(1,'rgba(255,226,164,0)');
    x.fillStyle=lg2; x.beginPath(); x.arc(lxs,lys,L.r*5.5,0,6.2832); x.fill();
    if(L.rays){
      x.globalAlpha=.13;
      for(var ry=0;ry<12;ry++){
        var aa=ry*0.5236+tt*.0016;
        x.beginPath(); x.moveTo(lxs,lys);
        x.lineTo(lxs+Math.cos(aa)*L.r*7,lys+Math.sin(aa)*L.r*7);
        x.lineWidth=2; x.strokeStyle=L.c; x.stroke();
      }
      x.globalAlpha=1;
    }
    x.fillStyle=L.c; x.beginPath(); x.arc(lxs,lys,L.r,0,6.2832); x.fill();
  }
  x.globalAlpha=P.star*(1-P.day*.9);
  for(i=0;i<stars.length;i++){
    var s=stars[i], sx1=((s.x-camX*.22)%WORLD+WORLD)%WORLD;
    if(sx1<VW) px(sx1,s.y,s.b,1,'#DCE6F5');
  }
  x.globalAlpha=1;

  var sameScene=(P.motifB===P.motifA);
  farLayer(P.motifA,1-P.mt,P); if(!sameScene) farLayer(P.motifB,P.mt,P);
  midLayer(P.motifA,1-P.mt,P); if(!sameScene) midLayer(P.motifB,P.mt,P);

  /* the ground */
  var gd=shade(P.gnd,.52+P.day*.32), cm=shade(P.cap,.62+P.day*.24), sf=P.surf;
  var tuft=shade(P.cap,.86), dark=shade(P.gnd,.24);
  for(i=0;i<VW;i++){
    var wxi=camX+i, gy=groundY(wxi)|0;
    px(i,gy,1,VH-gy,rgb(P.gnd));
    px(i,gy+16,1,VH-gy-16,gd);
    px(i,gy,1,1,rgb(P.cap));
    px(i,gy+1,1,2,cm);

    /* die Oberfläche selbst erzählt mit */
    var hsh=((wxi*2654435761)>>>0)%997;
    if(sf==='grass'){
      if(hsh%7<3){
        var sway=Math.sin(tt*.03+wxi*.21);
        var th=1+(hsh%3);
        px(i+(sway>.35?1:0),gy-th,1,th,tuft);
      }
    } else if(sf==='crack'){
      if(hsh%23<2){
        var dep=2+(hsh%6);
        px(i,gy+1,1,dep,dark);
        if(hsh%97<9) px(i+1,gy+2+(hsh%2),1,Math.max(1,dep-2),dark);
      }
    } else if(sf==='notch'){
      if((wxi|0)%8===0) px(i,gy+1,1,2,dark);
    } else if(sf==='rubble'){
      if(hsh%9<3){
        px(i,gy-1,1+(hsh%2),1,shade(P.cap,.5));
        px(i,gy+2,1,2+(hsh%4),dark);
      }
    }
  }
  /* the path already walked stays lit — others walk on it */
  for(i=0;i<VW;i++){
    var w2=camX+i;
    if(w2<player.x){ x.globalAlpha=.13; px(i,groundY(w2)-1,1,1,'#E9C06A'); }
  }
  x.globalAlpha=1;

  for(i=0;i<N;i++){
    var mx2=ST[i].x-camX;
    if(mx2>-30&&mx2<VW+30) monolith(mx2,groundY(ST[i].x)|0,ST[i],i);
  }

  /* the lamp you carry after the uniform — leadership, drawn as light */
  var lampR=lightRadius();
  if(lampR>2){
    var lx=player.x-camX, ly=player.y-9;
    var lg=x.createRadialGradient(lx+2,ly,0,lx+2,ly,lampR);
    var la2=(.30*(1-P.day*.78)).toFixed(3);
    lg.addColorStop(0,'rgba(255,232,178,'+la2+')');
    lg.addColorStop(.45,'rgba(240,198,120,'+(.11*(1-P.day*.78)).toFixed(3)+')');
    lg.addColorStop(1,'rgba(240,198,120,0)');
    x.fillStyle=lg; x.beginPath(); x.arc(lx+2,ly,lampR,0,6.2832); x.fill();
  }
  drawFx();
  /* dust under the boots */
  for(i=dust.length-1;i>=0;i--){
    var d=dust[i];
    x.globalAlpha=Math.max(0,d.l/26)*.5;
    px(d.x-camX,d.y,1,1,'#E8DCC0');
    x.globalAlpha=1;
  }

  /* the people who walk with you */
  drawFolk('iara'); drawFolk('isac'); drawFolk('bianca');

  var av=AVATAR[Math.max(0,Math.min(AVATAR.length-1,maxRead()))];
  var bob=(!player.air && Math.abs(player.vx)>.15 && (player.walk/6|0)%2===0)?-1:0;
  person(player.x-camX,player.y|0,(player.walk/6|0),av,bob,player.hurt,player.air);

  nearLayer(P.motifA,1-P.mt,P); if(!sameScene) nearLayer(P.motifB,P.mt,P);
}
function drawFolk(name){
  if(!joined[name]) return;
  var f=FOLK[name], t=trailAt(f.gap);
  if(!t) return;
  var bob=(Math.abs(player.vx)>.15 && ((player.walk+f.gap)/6|0)%2===0)?-1:0;
  person(t.x-camX,t.y|0,((player.walk+f.gap)/6|0),f,bob,player.hurt&&t.h,t.a);
}
function trailAt(gap){
  var idx=trail.length-1-gap;
  if(idx<0) return null;
  return trail[idx];
}
function maxRead(){ var m=-1; for(var i=0;i<read.length;i++) if(read[i]>m) m=read[i]; return m; }
function lightRadius(){
  if(maxRead()<4) return 0;                       /* the lamp is lit at the officer station */
  if(state==='storm') return 10+Math.max(0,(stormT-380))*.10;
  return 40+Math.sin(tt*.04)*3;
}

/* ══════════════ the storm ══════════════ */
function drawStorm(){
  var k=stormT/620, inten=Math.sin(Math.min(1,k)*Math.PI)*1+.25, i;
  if(stormT>380) inten*=Math.max(.25,1-(stormT-380)/240);
  for(i=0;i<9;i++){
    var yy=(Math.sin(tt*.06+i*2.7)*.5+.5)*VH|0, hh=2+((i*7)%3);
    x.globalAlpha=.20*inten; px(0,yy,VW,hh,(i%2)?'#E24A40':'#3EBAE2'); x.globalAlpha=1;
  }
  x.globalAlpha=.20*inten; px(0,0,VW,VH,'#12060A'); x.globalAlpha=1;
  var nf=(tt/4|0)*7;
  for(i=0;i<16;i++){
    x.globalAlpha=.22*inten;
    px(((i*97+nf)%VW)|0,((i*53+nf*2)%VH)|0,1,1,'#8899AA');
    x.globalAlpha=1;
  }
}

/* ══════════════ ending ══════════════ */
/* ── Abspann: die ganze Kurve, die du gerade gegangen bist ── */
function lifeX(wx){ return 14+(wx/WORLD)*292; }
function lifeY(wy){ return 26+((wy-64)/96)*62; }
function drawEnd(){
  px(0,0,VW,VH,'#080B14');
  var i;
  x.globalAlpha=.45;
  for(i=0;i<stars.length;i++){ var st=stars[i]; px(st.x%VW,st.y%70,1,1,'#28324C'); }
  x.globalAlpha=1;

  var draw=Math.min(1,endT/150);                 /* die Linie laeuft von links nach rechts */
  var edge=14+draw*292;

  /* der Boden unter der Kurve */
  for(i=14;i<edge;i++){
    var wx=((i-14)/292)*WORLD, gy=lifeY(groundY(wx));
    x.globalAlpha=.16; px(i,gy,1,106-gy,'#2A3550'); x.globalAlpha=1;
    px(i,gy,1,1,'#8FA6BE');
  }
  /* die Klippe von 2023 bekommt eine eigene Farbe */
  var cx0=lifeX(ST[8].x), cx1=lifeX(ST[9].x);
  if(edge>cx0){
    for(i=cx0|0;i<Math.min(edge,cx1);i++){
      var wx2=((i-14)/292)*WORLD;
      px(i,lifeY(groundY(wx2)),1,1,'#D08A3C');
    }
  }
  /* die Stationen leuchten auf, sobald die Linie sie erreicht */
  for(i=0;i<N;i++){
    var sxp=lifeX(ST[i].x); if(sxp>edge) continue;
    var syp=lifeY(ST[i].gy);
    var age=Math.min(1,(edge-sxp)/16);
    var c=(ST[i].act===2)?'#8FC0D8':((ST[i].gy<118)?'#EFE7D6':'#D08A3C');
    var pu=1+Math.sin(tt*.06+i)*.35;
    for(var r=2;r>0;r--){ x.globalAlpha=.09*pu*r*age; px(sxp-r,syp-r,2+r*2,2+r*2,c); }
    x.globalAlpha=age; px(sxp,syp,2,2,c); x.globalAlpha=1;
  }
  /* die Figur laeuft die fertige Kurve noch einmal ab */
  if(draw<1){
    var wxp=((edge-14)/292)*WORLD;
    person(edge-2,lifeY(groundY(wxp))|0,(tt/6|0),AVATAR[10],0);
  } else {
    var t2=((tt*.6)%340)/340, wxq=t2*WORLD;
    x.globalAlpha=.9;
    person(lifeX(wxq)-2,lifeY(groundY(wxq))|0,(tt/6|0),AVATAR[10],0);
    x.globalAlpha=1;
  }
}

  document.getElementById('i-h').textContent=t.introH;
  document.getElementById('i-body').innerHTML=t.intro;
  document.getElementById('i-meta').textContent=t.introMeta;
  document.getElementById('i-go').textContent=t.introGo;
  document.getElementById('b-de').classList.toggle('on',lang==='de');
  document.getElementById('b-en').classList.toggle('on',lang==='en');
  if(state==='dialog'&&active>=0) openDlg(active);
}
function reset(){
  read=[]; parts=[]; player.x=60; player.y=ST[0].gy; player.vx=0; player.vy=0;
  player.air=false; player.hurt=false; camX=0; camLead=0; active=-1; stormT=0; endT=0; state='title';
  joined={bianca:false,isac:false,iara:false}; trail=[]; dust=[];
  document.getElementById('end').classList.remove('show');
  document.getElementById('intro').classList.remove('show');
  document.getElementById('title').classList.add('show'); preUI();
  dlg.classList.remove('show'); prompt.classList.remove('show'); toast.classList.remove('show');
  fragsUI();
}

/* ══════════════ input ══════════════ */
function act(){
  if(state==='title'){
    document.getElementById('title').classList.remove('show');
    document.getElementById('intro').classList.add('show');
    state='intro'; preUI(); blip(520,.08); return;
  }
  if(state==='intro'){
    document.getElementById('intro').classList.remove('show');
    state='play'; preUI(); blip(660,.08); return;
  }
  if(state==='dialog'){ closeDlg(); blip(420,.07); return; }
  if(state==='end'){ reset(); return; }
  if(state==='play'&&active>=0) openDlg(active);
}
addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.r=true;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); act(); }
});
addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.r=false;
});
function hold(id,set){
  var b=document.getElementById(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();set(true);});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ b.addEventListener(ev,function(){set(false);}); });
}
hold('p-l',function(v){keys.l=v;});
hold('p-r',function(v){keys.r=v;});
document.getElementById('p-a').addEventListener('pointerdown',function(e){e.preventDefault();act();});
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('.btn')||e.target.closest('#pad')) return;
  if(state==='title'||state==='intro'||state==='dialog'||state==='end') act();
});
document.getElementById('b-de').onclick=function(){lang='de';chrome();};
document.getElementById('b-en').onclick=function(){lang='en';chrome();};
document.getElementById('b-snd').onclick=function(){
  sound=!sound; this.classList.toggle('on',sound); this.textContent=sound?'♪':'✕';
};

/* ══════════════ loop ══════════════ */
function step(){
  tt++;
  if(state==='play'||state==='storm'){
    /* uphill costs you — and so does being hurt */
    var slope=groundY(player.x+player.dir*3)-groundY(player.x);
    var up=Math.max(0,-slope/3);
    var fac=Math.max(.32,1/(1+up*1.1))*(player.hurt?.6:1)*(slope>1?1.12:1);
    var top=((state==='storm')?.62:1.5)*fac, acc=.16*fac;
    if(player.air){ acc*=.25; top*=1.1; }

    if(keys.r){ player.vx=Math.min(top,player.vx+acc); player.dir=1; }
    else if(keys.l){ player.vx=Math.max(-top,player.vx-acc); player.dir=-1; }
    else player.vx*=player.air?.99:.72;
    if(Math.abs(player.vx)<.02) player.vx=0;
    player.x+=player.vx;
    if(player.x<30) player.x=30;
    if(player.x>WORLD-40) player.x=WORLD-40;

    /* the ground can simply stop being there */
    var gy2=groundY(player.x);
    if(player.air || player.y<gy2-1.2){
      player.air=true; player.vy+=.44; player.y+=player.vy;
      if(player.y>=gy2){                         /* the landing that leaves a mark */
        if(player.vy>3.4){
          player.hurt=true; shake=Math.max(shake,7); blip(70,.42,'sawtooth');
          for(var b=0;b<16;b++) dust.push({x:player.x+(Math.random()-.5)*14,y:gy2,l:34});
        }
        player.y=gy2; player.vy=0; player.air=false;
      }
    } else { player.y=gy2; player.vy=0; }

    if(!player.air && Math.abs(player.vx)>.15){
      player.walk += player.hurt ? ((tt%3)?1:0) : 1;   /* wounded: an uneven gait */
      if(tt%(player.hurt?11:7)===0) dust.push({x:player.x-2*player.dir,y:player.y,l:26});
    }
    trail.push({x:player.x,y:player.y,a:player.air,h:player.hurt});
    if(trail.length>900) trail.shift();
    for(var q=dust.length-1;q>=0;q--){ dust[q].l--; if(dust[q].l<=0) dust.splice(q,1); }

    camLead+=((player.dir*20*Math.min(1,Math.abs(player.vx)))-camLead)*.04;
    camX=Math.max(0,Math.min(WORLD-VW,player.x-VW*0.42+camLead));

    if(state==='storm'){
      if(keys.r) stormT+=2.2; else stormT+=.25;
      shake=Math.max(0,(1-stormT/620))*2.2;
      if(stormT>380 && !joined.iara) join('iara');
      if(stormT>620){ state='play'; shake=0; blip(740,.22); }
    } else {
      active=-1;
      for(var i=0;i<N;i++){ if(Math.abs(player.x-ST[i].x)<26){ active=i; break; } }
      if(active>=0){ prompt.textContent=T[lang].read; prompt.classList.add('show'); }
      else prompt.classList.remove('show');
    }
  }
  if(state==='storm'){
    prompt.textContent=(stormT>430)?T[lang].pass:T[lang].hold;
    prompt.classList.add('show');
  }
  if(state==='end') endT++;
  if((state==='play'||state==='storm') && tt%6===0){
    var dp=blend().day;
    var vg=document.getElementById('vig'), cr=document.getElementById('crt');
    if(vg) vg.style.opacity=(0.30+0.70*(1-dp)).toFixed(2);
    if(cr) cr.style.opacity=(0.16+0.22*(1-dp)).toFixed(2);
  }
  if(state==='play'||state==='storm'){ spawnFx(blend().fx); stepFx(); }

  x.save();
  if(shake>0) x.translate((Math.random()-.5)*shake|0,(Math.random()-.5)*shake|0);
  if(state==='end') drawEnd(); else { drawWorld(); if(state==='storm') drawStorm(); }
  x.restore();
  requestAnimationFrame(step);
}
fragsUI(); chrome(); preUI(); step();
})();
</script>
